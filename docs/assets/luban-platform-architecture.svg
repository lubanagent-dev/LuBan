  <text x="560" y="250" text-anchor="middle" font-size="13" fill="#202124">流式聊天（SSE）</text>
  <text x="560" y="268" text-anchor="middle" font-size="11" fill="#5F6368">虚拟形象 · Markdown</text>
  <rect x="670" y="228" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#188038"/>
  <text x="760" y="250" text-anchor="middle" font-size="13" fill="#202124">文件上传 / 下载 ★</text>
  <text x="760" y="268" text-anchor="middle" font-size="11" fill="#5F6368">会话级 workspace</text>
  <rect x="870" y="228" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#188038"/>
  <text x="970" y="250" text-anchor="middle" font-size="13" fill="#202124">气泡内人工审批</text>
  <text x="970" y="268" text-anchor="middle" font-size="11" fill="#5F6368">高风险操作批准 / 拒绝</text>

  <!-- arrow L2 -> L3 -->
  <line x1="560" y1="294" x2="560" y2="322" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- L3 平台网关层 -->
  <rect x="40" y="326" width="1060" height="104" rx="12" fill="#FEF7E0" stroke="#F9AB00" stroke-width="1.6"/>
  <text x="60" y="352" font-size="14" font-weight="700" fill="#B06000">平台网关层</text>
  <rect x="70" y="364" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#F9AB00"/>
  <text x="180" y="386" text-anchor="middle" font-size="13" fill="#202124">RBAC 鉴权裁决 ★</text>
  <text x="180" y="404" text-anchor="middle" font-size="11" fill="#5F6368">逐请求 · 用户/角色/权限</text>
  <rect x="310" y="360" width="300" height="58" rx="8" fill="#FFF8E1" stroke="#F9AB00" stroke-width="2"/>
  <text x="460" y="384" text-anchor="middle" font-size="13.5" font-weight="700" fill="#B06000">★ 动态资源装配器（核心）</text>
  <text x="460" y="403" text-anchor="middle" font-size="11" fill="#5F6368">按 subject 权限过滤 Tool/MCP/Skill/知识库后装配 Run</text>
  <text x="460" y="416" text-anchor="middle" font-size="11" fill="#5F6368">对应帖子最高票路线 C · 代码执行不靠 Prompt</text>
  <rect x="630" y="364" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#F9AB00"/>
  <text x="740" y="386" text-anchor="middle" font-size="13" fill="#202124">主体配额闸 ★</text>
  <text x="740" y="404" text-anchor="middle" font-size="11" fill="#5F6368">按人/角色 Token·费用·并发</text>
  <rect x="870" y="364" width="200" height="50" rx="8" fill="#FFFFFF" stroke="#F9AB00"/>
  <text x="970" y="386" text-anchor="middle" font-size="13" fill="#202124">审计事件 ★</text>
  <text x="970" y="404" text-anchor="middle" font-size="11" fill="#5F6368">登录/授权/审批/文件</text>

  <!-- arrow L3 -> L4 -->
  <line x1="560" y1="430" x2="560" y2="458" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- L4 LuBan 核心 -->
  <rect x="40" y="462" width="1060" height="136" rx="12" fill="#F3E8FD" stroke="#A142F4" stroke-width="1.6"/>
  <text x="60" y="488" font-size="14" font-weight="700" fill="#6A1FA2">LuBanAgent 核心引擎（LangGraph · 既有能力）</text>
  <rect x="70" y="500" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#A142F4"/>
  <text x="185" y="522" text-anchor="middle" font-size="13" fill="#202124">Agent 定义入库版本化</text>
  <text x="185" y="540" text-anchor="middle" font-size="11" fill="#5F6368">改配置不发版 · 运行期生效</text>
  <rect x="320" y="500" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#A142F4"/>
  <text x="435" y="522" text-anchor="middle" font-size="13" fill="#202124">Runtime（prebuilt + 图）</text>
  <text x="435" y="540" text-anchor="middle" font-size="11" fill="#5F6368">多 Agent supervisor 委派</text>
  <rect x="570" y="500" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#A142F4"/>
  <text x="685" y="522" text-anchor="middle" font-size="13" fill="#202124">治理四道闸 + 审批流</text>
  <text x="685" y="540" text-anchor="middle" font-size="11" fill="#5F6368">步数/预算/超时/取消 · 可恢复</text>
  <rect x="820" y="500" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#A142F4"/>
  <text x="945" y="522" text-anchor="middle" font-size="13" fill="#202124">模型工厂 + 费用归因</text>
  <text x="945" y="540" text-anchor="middle" font-size="11" fill="#5F6368">fast/smart/cheap/vision 槽位</text>

  <!-- arrows L4 -> L5 -->
  <line x1="370" y1="598" x2="370" y2="626" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="760" y1="598" x2="760" y2="626" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>

