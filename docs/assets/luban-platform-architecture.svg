  <text x="126" y="698" text-anchor="middle" font-size="13" fill="#202124">知识库</text>
  <text x="126" y="716" text-anchor="middle" font-size="11" fill="#5F6368">RAG · 检索前过权限</text>
  <rect x="198" y="670" width="120" height="66" rx="8" fill="#FFFFFF" stroke="#00838F"/>
  <text x="258" y="698" text-anchor="middle" font-size="13" fill="#202124">Skill</text>
  <text x="258" y="716" text-anchor="middle" font-size="11" fill="#5F6368">版本 · 分配可见</text>
  <rect x="330" y="670" width="120" height="66" rx="8" fill="#FFFFFF" stroke="#00838F"/>
  <text x="390" y="698" text-anchor="middle" font-size="13" fill="#202124">MCP</text>
  <text x="390" y="716" text-anchor="middle" font-size="11" fill="#5F6368">统一连接池</text>
  <rect x="462" y="670" width="120" height="66" rx="8" fill="#FFFFFF" stroke="#00838F"/>
  <text x="522" y="698" text-anchor="middle" font-size="13" fill="#202124">Tool</text>
  <text x="522" y="716" text-anchor="middle" font-size="11" fill="#5F6368">Python 代码受治理</text>
  <rect x="594" y="670" width="86" height="66" rx="8" fill="#FFFFFF" stroke="#00838F"/>
  <text x="637" y="698" text-anchor="middle" font-size="13" fill="#202124">Prompt</text>
  <text x="637" y="716" text-anchor="middle" font-size="11" fill="#5F6368">库 · 版本</text>
  <text x="66" y="752" font-size="11" fill="#006064">分配关系表（resource × subject/role）★ —— 帖子 #35/#39 需求：低权限看不到不该看的资源</text>

  <!-- L5-right 隔离层 -->
  <rect x="740" y="630" width="360" height="128" rx="12" fill="#FCE8E6" stroke="#C5221F" stroke-width="1.6"/>
  <text x="760" y="656" font-size="14" font-weight="700" fill="#A50E0E">执行隔离（分级，对应帖子教训）</text>
  <rect x="766" y="670" width="140" height="66" rx="8" fill="#FFFFFF" stroke="#C5221F"/>
  <text x="836" y="694" text-anchor="middle" font-size="13" fill="#202124">默认：治理闸</text>
  <text x="836" y="712" text-anchor="middle" font-size="11" fill="#5F6368">+ workspace + 审批</text>
  <text x="836" y="727" text-anchor="middle" font-size="11" fill="#5F6368">（路线 A+C，可信用户）</text>
  <rect x="926" y="670" width="150" height="66" rx="8" fill="#FFFFFF" stroke="#C5221F" stroke-dasharray="5 3"/>
  <text x="1001" y="694" text-anchor="middle" font-size="13" fill="#202124">可选：会话级容器 ★</text>
  <text x="1001" y="712" text-anchor="middle" font-size="11" fill="#5F6368">compose profile · 用完销毁</text>
  <text x="1001" y="727" text-anchor="middle" font-size="11" fill="#5F6368">（不可信外部用户）</text>
  <text x="766" y="752" font-size="11" fill="#A50E0E">教训：容器与进程沙盒互斥，二选一；MCP 过多改 CLI 连接器</text>

  <!-- L5-right-2 渠道层 -->
  <rect x="1120" y="630" width="280" height="128" rx="12" fill="#FFFFFF" stroke="#9AA0A6" stroke-dasharray="6 4" stroke-width="1.6"/>
  <text x="1140" y="656" font-size="14" font-weight="700" fill="#5F6368">商用渠道层（可拆卸）</text>
  <rect x="1140" y="670" width="110" height="66" rx="8" fill="#F1F3F4" stroke="#9AA0A6"/>
  <text x="1195" y="698" text-anchor="middle" font-size="12.5" fill="#202124">IM 接入</text>
  <text x="1195" y="716" text-anchor="middle" font-size="11" fill="#5F6368">微信/飞书/钉钉</text>
  <rect x="1266" y="670" width="114" height="66" rx="8" fill="#F1F3F4" stroke="#9AA0A6"/>
  <text x="1323" y="698" text-anchor="middle" font-size="12.5" fill="#202124">电商客服</text>
  <text x="1323" y="716" text-anchor="middle" font-size="11" fill="#5F6368">会话状态机·风控</text>
  <text x="1140" y="752" font-size="11" fill="#9AA0A6">ChannelConnector / SessionStateStore / OutputGuard</text>

  <!-- arrows to bottom -->
  <line x1="560" y1="758" x2="560" y2="786" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <!-- channel one-way dependency -->
  <path d="M 1260 630 L 1260 560 L 1108 545" fill="none" stroke="#9AA0A6" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="1268" y="585" font-size="11" fill="#9AA0A6">单向依赖</text>

  <!-- L6 底座 -->
  <rect x="40" y="790" width="1360" height="104" rx="12" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.6"/>
  <text x="60" y="816" font-size="14" font-weight="700" fill="#3C4043">持久化与观测（内部 DB 是唯一可信源）</text>
  <rect x="70" y="828" width="300" height="52" rx="8" fill="#FFFFFF" stroke="#5F6368"/>
  <text x="220" y="850" text-anchor="middle" font-size="13" fill="#202124">MySQL / SQLite</text>
  <text x="220" y="868" text-anchor="middle" font-size="11" fill="#5F6368">Run/Trace · 会话与消息 ★ · 分配 ★ · 配额 ★ · 审计 ★</text>
  <rect x="400" y="828" width="290" height="52" rx="8" fill="#FFFFFF" stroke="#5F6368"/>
  <text x="545" y="850" text-anchor="middle" font-size="13" fill="#202124">Langfuse 自部署（可切换）</text>
  <text x="545" y="868" text-anchor="middle" font-size="11" fill="#5F6368">ObservabilityBackend 双写 · 数据主权</text>
  <rect x="720" y="828" width="290" height="52" rx="8" fill="#FFFFFF" stroke="#5F6368"/>
  <text x="865" y="850" text-anchor="middle" font-size="13" fill="#202124">日志排查 / Trace 可视化</text>
  <text x="865" y="868" text-anchor="middle" font-size="11" fill="#5F6368">Run 树回放 · 费用归因查询</text>
  <rect x="1040" y="828" width="330" height="52" rx="8" fill="#FFFFFF" stroke="#5F6368"/>
  <text x="1205" y="850" text-anchor="middle" font-size="13" fill="#202124">部署基座</text>
  <text x="1205" y="868" text-anchor="middle" font-size="11" fill="#5F6368">docker compose · 领地隔离 · upstream 跟版</text>

  <text x="720" y="936" text-anchor="middle" font-size="12" fill="#5F6368">★ = 本次改造新增/升级 · 全部新代码位于 lubanagent/ 与 lubanagent/ui 领地，app/ 用户领地不受影响 · PORTAL_ENABLED=false 退回纯基座形态</text>
  <text x="720" y="958" text-anchor="middle" font-size="12" fill="#5F6368">数据流：用户 → 门户（登录/会话/文件/审批）→ 网关（鉴权 → 动态装配 → 配额）→ Runtime（治理）→ 资源/沙箱 → 留痕</text>
</svg>
