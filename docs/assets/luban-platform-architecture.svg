<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1010" viewBox="0 0 1440 1010" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5F6368"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#188038"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="1010" fill="#FAFAFA"/>
  <text x="720" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#202124">LuBanAgent 用户端平台化改造 · 总体架构</text>
  <text x="720" y="64" text-anchor="middle" font-size="12" fill="#5F6368">改造点标 ★ · 沿用既有能力不标 · 依据 linux.do/t/2854294 全量调研</text>

  <!-- L1 用户层 -->
  <rect x="40" y="84" width="1360" height="86" rx="12" fill="#E8F0FE" stroke="#4285F4"/>
  <text x="60" y="110" font-size="14" font-weight="700" fill="#174EA6">用户层</text>
  <rect x="180" y="100" width="270" height="54" rx="8" fill="#FFFFFF" stroke="#4285F4"/>
  <text x="315" y="123" text-anchor="middle" font-size="13" fill="#202124">外部客服 / 业务人员</text>
  <text x="315" y="143" text-anchor="middle" font-size="11" fill="#5F6368">浏览器零安装 · 非技术用户</text>
  <rect x="480" y="100" width="270" height="54" rx="8" fill="#FFFFFF" stroke="#4285F4"/>
  <text x="615" y="123" text-anchor="middle" font-size="13" fill="#202124">平台管理员</text>
  <text x="615" y="143" text-anchor="middle" font-size="11" fill="#5F6368">开发者工作台 · 分配与配额管理 ★</text>
  <rect x="780" y="100" width="270" height="54" rx="8" fill="#FFFFFF" stroke="#4285F4" stroke-dasharray="4 3"/>
  <text x="915" y="123" text-anchor="middle" font-size="13" fill="#202124">业务系统（自建用户端）</text>
  <text x="915" y="143" text-anchor="middle" font-size="11" fill="#5F6368">REST / SSE 直连 · 门户可关闭</text>
  <rect x="1080" y="100" width="290" height="54" rx="8" fill="#FFFFFF" stroke="#9AA0A6" stroke-dasharray="4 3"/>
  <text x="1225" y="123" text-anchor="middle" font-size="13" fill="#5F6368">商用渠道：IM / 电商客服</text>
  <text x="1225" y="143" text-anchor="middle" font-size="11" fill="#9AA0A6">独立可拆卸模块（F14–F16）</text>

  <!-- arrow L1 -> L2 -->
  <line x1="315" y1="154" x2="315" y2="186" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="615" y1="154" x2="615" y2="186" stroke="#5F6368" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- L2 用户端门户 -->
