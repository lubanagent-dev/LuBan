  <text x="60" y="216" font-size="14" font-weight="700" fill="#0D652D">用户端门户 ★（/chat 升级为一等交付物 · PORTAL_ENABLED 开关）</text>
  <rect x="70" y="228" width="180" height="50" rx="8" fill="#FFFFFF" stroke="#188038"/>
  <text x="160" y="250" text-anchor="middle" font-size="13" fill="#202124">注册 / 登录 ★</text>
  <text x="160" y="268" text-anchor="middle" font-size="11" fill="#5F6368">终端用户账号域</text>
